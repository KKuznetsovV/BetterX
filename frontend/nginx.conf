resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /drafts/ {
        set $ai_upstream http://ai-service:3005;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /uploads/ {
        set $media_upstream http://media-service:3006;
        proxy_pass $media_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/notifications(/|$) {
        set $notification_upstream http://notification-service:3007;
        proxy_pass $notification_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/likes(/|$) {
        set $engagement_upstream http://engagement-service:3008;
        proxy_pass $engagement_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/(feed|comments|posts)(/|$) {
        set $content_upstream http://content-service:3009;
        proxy_pass $content_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/(profile|follows|users)(/|$) {
        set $identity_upstream http://identity-service:3010;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/recommendations(/|$) {
        set $recommendation_upstream http://recommendation-service:3011;
        proxy_pass $recommendation_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/auth(/|$) {
        set $identity_auth_upstream http://identity-service:3010;
        proxy_pass $identity_auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
